## PixelDDT Phase-2-no-dropout experiment
##
## Identical to PixelDDTv2_small_lora_project_free_layer.yaml in every parameter
## except stage_2.target, which points to the p2nodrop subclass.
##
## The only behavioural change: during training, Phase-2 (extract_clean_s) never
## applies class label dropout to the DDT encoder's y_embedder.  Phase-1 and
## Phase-3 dropout are unchanged (class_dropout_prob=0.1 still active in Phase 3).
##
## Motivation: align training distribution with CFG inference.
##   Base class training:  Phase2 uncond occurs 10% of the time (wasted)
##   This variant:         Phase2 always cond → matches CFG inference exactly
##
## Training command:
##   torchrun --standalone --nnodes=1 --nproc_per_node=8 \
##       src/train_stage3_projcet_free_layer.py \
##       --config configs/stage2/training/PixelDDTv2_small_lora_project_free_layer_p2nodrop.yaml \
##       --data-path /path/to/imagenet/train \
##       --results-dir /path/to/ckpts/p2nodrop \
##       --precision bf16

stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'Dinov2withNorm'
    encoder_config_path: '/data/shihaoyang/pretrained/encoders/dinov2-with-registers-base'
    encoder_input_size: 224
    encoder_params:
      dinov2_path: '/data/shihaoyang/pretrained/encoders/dinov2-with-registers-base'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTXL'
    pretrained_decoder_path: '/data/shihaoyang/pretrained/decoders/dinov2/wReg_base/ViTXL_n08/model.pt'
    noise_tau: 0.0
    reshape_to_2d: true
    normalization_stat_path: '/data/shihaoyang/pretrained/stats/dinov2/wReg_base/imagenet1k/stat.pt'


stage_2:
  # ↓ Only difference from the base training config ↓
  target: stage2.models.PixelDDTv2_project_free_layer_p2nodrop.PixelDDT
  params:
    input_size: 256
    patch_size: 16
    in_channels: 3
    hidden_size: 768      # check
    depth: 6              # check
    num_heads: 12         # check
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 1000
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    use_lora: false
    lora_rank: 16
    rae_inject_layers: [2]
    rae_inject_final_layer: false
    use_direct_rae_injection: false
    use_y_embedder: true
    use_adaln_zero: true
    direct_rae_in_channels: 768

    stage2_ckpt: '/data/shihaoyang/pretrained/DiTs/Dinov2/wReg_base/ImageNet256/DiTDH-S_ep20/stage2_model.pt'
    stage2_config:
      input_size: 16
      patch_size: 1
      in_channels: 768
      hidden_size: [384, 2048]
      depth: [12, 2]
      num_heads: [6, 16]
      mlp_ratio: 4.0
      class_dropout_prob: 0.1
      num_classes: 1000
      use_qknorm: false
      use_swiglu: true
      use_rope: true
      use_rmsnorm: true
      wo_shift: false
      use_pos_embed: true

transport:
  params:
    path_type: 'Linear'
    prediction: 'data'
    loss_weight: 'velocity'
    time_dist_type: 'logit-normal_0.8_0.8'

transport_rae:
  params:
    path_type: 'Linear'
    prediction: 'velocity'
    loss_weight: null
    time_dist_type: 'logit-normal_0_1'

sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50

sampler_rae:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50

guidance:
  method: 'cfg'
  scale: 1.0
  t_min: 0.0
  t_max: 1.0

misc:
  latent_size: [3, 256, 256]
  num_classes: 1000
  time_dist_shift_dim: 4096
  time_dist_shift_base: 4096

misc_rae:
  latent_size: [768, 16, 16]
  num_classes: 1000
  time_dist_shift_dim: 196608
  time_dist_shift_base: 4096

eval:
  eval_interval: 25000
  eval_model: true
  data_path: '/data/shihaoyang/data/imagenet/256/val'
  reference_npz_path: '/data/shihaoyang/data/VIRTUAL_imagenet256_labeled.npz'

training:
  epochs: 1400
  global_batch_size: 256
  grad_accum_steps: 1
  ema_decay: 0.9999
  num_workers: 16
  log_interval: 10
  checkpoint_interval: 1
  sample_every: 2000
  clip_grad: 1.0
  global_seed: 42
  rae_loss_weight: 0.01
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 40
    decay_end_epoch: 800
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_from_zero: false
