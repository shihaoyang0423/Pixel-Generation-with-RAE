stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'Dinov2withNorm'
    encoder_config_path: '/data/shihaoyang/pretrained/encoders/dinov2-with-registers-base'
    encoder_input_size: 224
    encoder_params:
      dinov2_path: '/data/shihaoyang/pretrained/encoders/dinov2-with-registers-base'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTXL'
    pretrained_decoder_path: '/data/shihaoyang/pretrained/decoders/dinov2/wReg_base/ViTXL_n08/model.pt'
    noise_tau: 0.0
    reshape_to_2d: true
    normalization_stat_path: '/data/shihaoyang/pretrained/stats/dinov2/wReg_base/imagenet1k/stat.pt'

stage_2:
  target: stage2.models.PixelDDTv2_project_free_layer.PixelDDT
  params:
    input_size: 256
    patch_size: 16
    in_channels: 3
    hidden_size: 768
    depth: 6
    num_heads: 12
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 1000
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    use_lora: false
    lora_rank: 16
    rae_inject_layers: [2]
    rae_inject_final_layer: false
    use_direct_rae_injection: false
    use_y_embedder: true
    use_adaln_zero: true
    direct_rae_in_channels: 768

    stage2_ckpt: '/home/shihaoyang/data/pretrained/DiTs/Dinov2/wReg_base/ImageNet256/DiTDH-S_ep20/stage2_model.pt'
    stage2_config:
      input_size: 16
      patch_size: 1
      in_channels: 768
      hidden_size: [384, 2048]
      depth: [12, 2]
      num_heads: [6, 16]
      mlp_ratio: 4.0
      class_dropout_prob: 0.1
      num_classes: 1000
      use_qknorm: false
      use_swiglu: true
      use_rope: true
      use_rmsnorm: true
      wo_shift: false
      use_pos_embed: true

transport:
  params:
    path_type: 'Linear'
    prediction: 'data'
    loss_weight: 'velocity'
    time_dist_type: 'logit-normal_0.8_0.8'

transport_rae:
  params:
    path_type: 'Linear'
    prediction: 'velocity'
    loss_weight: null
    time_dist_type: 'logit-normal_0_1'

sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50

sampler_rae:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50

guidance:
  method: 'autoguidance'
  scale: 1.05
  t_min: 0.0
  t_max: 1.0
  # AutoGuidance is applied to the DiTDH/RAE condition path.
  # Good DiTDH comes from stage_2.params.stage2_ckpt; bad DiTDH is below.
  # Both receive the same class condition y.
  ag_phase: 'condition'
  guidance_model:
    # Compact form: the sampler inherits stage_2.params.stage2_config and
    # instantiates stage2.models.DDT.DiTwDDTHead, not a PixelDDT head.
    ckpt: '/home/shihaoyang/data/pretrained/DiTs/Dinov2/wReg_base/ImageNet256/DiTDH-S_ep14/stage2_model.pt'

misc:
  latent_size: [3, 256, 256]
  num_classes: 1000
  # pix_ts = sqrt(4096 / 4096) = 1.0
  time_dist_shift_dim: 4096
  time_dist_shift_base: 4096

misc_rae:
  latent_size: [768, 16, 16]
  num_classes: 1000
  time_dist_shift_dim: 196608
  time_dist_shift_base: 4096
