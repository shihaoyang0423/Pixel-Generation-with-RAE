## Sampling config for Phase-2-no-dropout experiment (p2nodrop) — CFG scale sweep.
##
## stage_2.target points to the p2nodrop subclass.
## At inference (model.eval()) this is behaviourally identical to the base class,
## but loading the correct class keeps experiment provenance clear.
##
## cfg_sweep.scales is read by eval_cfg_scale_sweep_p2nodrop.py only;
## the sampling script (sample_pix_ddt_project_free_layer.py) ignores it.

stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'Dinov2withNorm'
    encoder_config_path: '/data/shihaoyang/pretrained/encoders/dinov2-with-registers-base'
    encoder_input_size: 224
    encoder_params:
      dinov2_path: '/data/shihaoyang/pretrained/encoders/dinov2-with-registers-base'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTXL'
    pretrained_decoder_path: '/data/shihaoyang/pretrained/decoders/dinov2/wReg_base/ViTXL_n08/model.pt'
    noise_tau: 0.0
    reshape_to_2d: true
    normalization_stat_path: '/data/shihaoyang/pretrained/stats/dinov2/wReg_base/imagenet1k/stat.pt'

stage_2:
  target: stage2.models.PixelDDTv2_project_free_layer_p2nodrop.PixelDDT
  params:
    input_size: 256
    patch_size: 16
    in_channels: 3
    hidden_size: 768
    depth: 6
    num_heads: 12
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 1000
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    use_lora: false
    lora_rank: 16
    rae_inject_layers: [2]
    rae_inject_final_layer: false
    use_direct_rae_injection: false
    use_y_embedder: true
    use_adaln_zero: true
    direct_rae_in_channels: 768

    stage2_ckpt: '/data/shihaoyang/pretrained/DiTs/Dinov2/wReg_base/ImageNet256/DiTDH-S_ep20/stage2_model.pt'
    stage2_config:
      input_size: 16
      patch_size: 1
      in_channels: 768
      hidden_size: [384, 2048]
      depth: [12, 2]
      num_heads: [6, 16]
      mlp_ratio: 4.0
      class_dropout_prob: 0.1
      num_classes: 1000
      use_qknorm: false
      use_swiglu: true
      use_rope: true
      use_rmsnorm: true
      wo_shift: false
      use_pos_embed: true

transport:
  params:
    path_type: 'Linear'
    prediction: 'data'
    loss_weight: 'velocity'
    time_dist_type: 'logit-normal_0.8_0.8'

transport_rae:
  params:
    path_type: 'Linear'
    prediction: 'velocity'
    loss_weight: null
    time_dist_type: 'logit-normal_0_1'

sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50

sampler_rae:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50

guidance:
  method: 'cfg'
  scale: 1.0    # fallback when running sampling script directly; overridden by sweep
  t_min: 0.0
  t_max: 1.0

misc:
  latent_size: [3, 256, 256]
  num_classes: 1000
  time_dist_shift_dim: 4096
  time_dist_shift_base: 4096

misc_rae:
  latent_size: [768, 16, 16]
  num_classes: 1000
  time_dist_shift_dim: 196608
  time_dist_shift_base: 4096

# ---------------------------------------------------------------------------
# CFG scale sweep — read by eval_cfg_scale_sweep_p2nodrop.py only.
# 1.0 = no-CFG baseline, included for direct comparison within the same sweep.
# ---------------------------------------------------------------------------
cfg_sweep:
  scales: [1.0, 1.5, 2.0, 2.5, 3.0, 4.0, 5.0, 7.0]
